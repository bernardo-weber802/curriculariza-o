<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aventura com o Leo – Jogo para a Pré-escola II</title>
<style>
:root{--ceu:#bfe8ff;--sol:#ffd23f;--coral:#ff6b57;--folha:#2fb86b;--uva:#7b4fd6;--tinta:#2a2350;--branco:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;color:var(--tinta);
background:radial-gradient(circle at 15% 10%,#fff8 0 60px,#0000 61px),radial-gradient(circle at 85% 18%,#fff8 0 45px,#0000 46px),linear-gradient(var(--ceu),#e9f8ff 60%,#c8f0c0 60%);
display:flex;justify-content:center}
main{width:100%;max-width:900px;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:5px solid var(--uva);outline-offset:3px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{background:var(--branco);border-radius:999px;padding:10px 18px;font-size:1.1rem;box-shadow:0 4px 0 #0002}
.teca{display:flex;align-items:center;gap:12px}
.mascote{font-size:4.4rem;line-height:1;animation:balanca 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes balanca{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.balao{background:var(--branco);border-radius:28px;padding:14px 20px;font-size:clamp(1.3rem,4vw,2rem);font-weight:700;box-shadow:0 5px 0 #0002;position:relative;flex:1}
.balao::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid #0000;border-right-color:var(--branco);border-left:0}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;flex:1;align-content:center}
.tema{border-radius:32px;padding:22px 10px;font-size:clamp(1.3rem,3.6vw,1.9rem);font-weight:700;color:var(--branco);box-shadow:0 8px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
.tema:active{transform:translateY(5px);box-shadow:0 3px 0 #0003}
.tema span{font-size:3.4rem}
.opcoes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;align-content:center}
.op{background:var(--branco);border-radius:30px;box-shadow:0 8px 0 #0002;min-height:150px;font-size:clamp(2.6rem,10vw,5rem);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;transition:transform .12s}
.op small{font-size:clamp(1.1rem,3vw,1.6rem);font-weight:700}
.op.cor{border:6px solid var(--branco)}
.op:active{transform:translateY(5px)}
.op.errou{animation:treme .4s;opacity:.45}
.op.acertou{background:#c9f7d8;outline:6px solid var(--folha);animation:pula .5s}
@keyframes treme{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pula{50%{transform:scale(1.1)}}
.cena{background:var(--branco);border-radius:30px;padding:14px;text-align:center;font-size:clamp(2.2rem,8vw,4rem);line-height:1.25;box-shadow:0 6px 0 #0002;word-break:break-word}
.letra{font-size:clamp(5rem,20vw,9rem);font-weight:800;color:var(--uva);line-height:1}
.acao{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--sol);border-radius:999px;padding:14px 28px;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 #0003}
.btn.sec{background:var(--branco)}
.estrelas{font-size:2rem;letter-spacing:4px}
.fim{text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.fim h1{font-size:clamp(2rem,7vw,3.6rem);margin:0}
.chuva{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.chuva i{position:absolute;top:-60px;font-style:normal;font-size:2rem;animation:cai 1.6s linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(360deg)}}
@media(max-width:560px){.opcoes{gap:10px}.op{min-height:120px;border-radius:22px}.mascote{font-size:3.2rem}.menu{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const MASC='🦁'; // troque aqui o animal da mascote (ex.: '🐱', '🐶', '🐰', '🦊', '🐼')
const $=document.getElementById('app');
const emb=a=>[...a].sort(()=>Math.random()-.5);
const um=a=>a[Math.floor(Math.random()*a.length)];
let som=true;
function fala(t){if(!som||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.85;u.pitch=1.2;speechSynthesis.speak(u)}

/* ---------- Áudios do Leo (pasta audios/) ---------- */
let seq=0,atual=null;
function parar(){seq++;if(atual){atual.pause();atual=null}if('speechSynthesis' in window)speechSynthesis.cancel()}
// toca uma lista de arquivos em sequência; se algum faltar, fala o texto com a voz do navegador
function toca(arqs,texto,aguardaToque){
  if(!som)return;
  parar();
  const meu=seq;let i=0;
  const prox=()=>{
    if(meu!==seq||i>=arqs.length)return;
    const a=new Audio('audios/'+arqs[i++]+'.mp3');
    atual=a;a.onended=prox;
    a.play().catch(e=>{
      if(meu!==seq)return;
      if(e&&e.name==='NotAllowedError'){ // o navegador exige um toque antes de tocar som
        if(aguardaToque)document.addEventListener('pointerdown',()=>toca(arqs,texto),{once:true});
      }else fala(texto);
    });
  };
  prox();
}
const ELOGIOS=[['Muito bem!','acerto1'],['Isso mesmo!','acerto2'],['Parabéns!','acerto3'],['Você acertou!','acerto4']];

/* ---------- Conteúdos (4 temas) ---------- */
const CORES=[['vermelho','#e53935'],['azul','#1e88e5'],['amarelo','#fdd835'],['verde','#43a047'],['laranja','#fb8c00'],['roxo','#8e24aa'],['rosa','#ec407a'],['marrom','#6d4c41']];
const FRUTAS=[['maçãs','🍎','macas'],['bananas','🍌','bananas'],['estrelas','⭐','estrelas'],['bolas','⚽','bolas'],['flores','🌼','flores'],['peixes','🐟','peixes']];
const BICHOS=[['o peixe','🐟','Mar','peixe'],['a baleia','🐳','Mar','baleia'],['a vaca','🐄','Fazenda','vaca'],['o porco','🐖','Fazenda','porco'],['a galinha','🐔','Fazenda','galinha'],['o macaco','🐒','Floresta','macaco'],['a onça','🐆','Floresta','onca'],['o pinguim','🐧','Gelo','pinguim'],['o urso polar','🐻‍❄️','Gelo','urso'],['o camelo','🐪','Deserto','camelo']];
const LUGARES={Mar:'🌊',Fazenda:'🚜',Floresta:'🌳',Gelo:'❄️',Deserto:'🏜️'};
const PALAVRAS=[['B','bola','⚽'],['G','gato','🐱'],['C','casa','🏠'],['D','dado','🎲'],['L','lua','🌙'],['S','sapo','🐸'],['M','mala','🧳'],['P','pato','🦆'],['V','vaca','🐄'],['U','uva','🍇']];

const TEMAS={
 cores:{nome:'Cores',ico:'🎨',cor:'#ff6b57',rodada(){
  const [n,h]=um(CORES);const outras=emb(CORES.filter(c=>c[0]!==n)).slice(0,2);
  return{fala:`Qual é a cor ${n}?`,aud:['cor-'+n],cena:'🎨',ops:emb([[n,h],...outras]).map(c=>({html:'',cor:c[1],ok:c[0]===n,rot:c[0]}))}}},
 conta:{nome:'Contar',ico:'🔢',cor:'#2fb86b',rodada(){
  const [nm,e,k]=um(FRUTAS);const q=1+Math.floor(Math.random()*9);
  const d=emb([1,2,3,4,5,6,7,8,9].filter(x=>x!==q)).slice(0,2);
  return{fala:`Quantas ${nm} você vê?`,aud:['conta-'+k],cena:e.repeat(q),ops:emb([q,...d]).map(x=>({html:x,ok:x===q,rot:String(x)}))}}},
 bichos:{nome:'Animais',ico:'🐒',cor:'#e08a00',rodada(){
  const [nm,e,l,k]=um(BICHOS);const outros=emb(Object.keys(LUGARES).filter(x=>x!==l)).slice(0,2);
  return{fala:`Onde mora ${nm}?`,aud:['onde-'+k],cena:e,ops:emb([l,...outros]).map(x=>({html:LUGARES[x],ok:x===l,rot:x}))}}},
 letras:{nome:'Letras',ico:'🔤',cor:'#7b4fd6',rodada(){
  const [L,w]=um(PALAVRAS);const outras=emb(PALAVRAS.filter(p=>p[0]!==L)).slice(0,2);
  return{fala:`Qual figura começa com a letra ${L}?`,aud:['letra-'+L.toLowerCase()],cena:`<div class="letra">${L}</div>`,ops:emb([[L,w,PALAVRAS.find(p=>p[0]===L)[2]],...outras]).map(p=>({html:p[2],ok:p[0]===L,rot:p[1],mudo:true}))}}}
};
const TOTAL=5;
let jogo=null;

function menu(){
  jogo=null;
  $.innerHTML=`<div class="topo"><div class="mini">🌈 Aventura com o Leo</div><button class="mini" id="som" aria-label="Ligar ou desligar o som">${som?'🔊':'🔇'}</button></div>
  <div class="teca"><div class="mascote" aria-hidden="true">${MASC}</div><div class="balao">Oi! Eu sou o Leo. Vamos brincar? Escolha uma aventura!</div></div>
  <div class="menu">${Object.entries(TEMAS).map(([k,t])=>`<button class="tema" data-t="${k}" style="background:${t.cor}"><span aria-hidden="true">${t.ico}</span>${t.nome}</button>`).join('')}</div>`;
  $.querySelector('#som').onclick=()=>{som=!som;parar();menu()};
  $.querySelectorAll('.tema').forEach(b=>b.onclick=()=>{jogo={t:b.dataset.t,n:0,pts:0};proxima()});
  toca(['boas-vindas'],'Oi! Eu sou o Leo. Vamos brincar? Escolha uma aventura!',true);
}

function proxima(){
  if(jogo.n>=TOTAL)return fim();
  if(!jogo.vistos)jogo.vistos=new Set();
  let r,tent=0;
  do{r=TEMAS[jogo.t].rodada();tent++}while(jogo.vistos.has(r.fala+r.cena)&&tent<60);
  jogo.vistos.add(r.fala+r.cena);jogo.r=r;jogo.erro=false;
  $.innerHTML=`<div class="topo"><button class="mini" id="voltar">🏠 Início</button><div class="mini estrelas" aria-label="${jogo.pts} estrelas">${'⭐'.repeat(jogo.pts)}${'☆'.repeat(TOTAL-jogo.pts)}</div></div>
  <div class="teca"><div class="mascote" aria-hidden="true">${MASC}</div><div class="balao" id="bal">${r.fala}</div></div>
  <div class="cena">${r.cena}</div>
  <div class="opcoes">${r.ops.map((o,i)=>`<button class="op ${o.cor?'cor':''}" data-i="${i}" ${o.cor?`style="background:${o.cor}" aria-label="${o.rot}"`:`aria-label="${o.rot}"`}>${o.html}${o.cor||o.mudo?'':`<small>${o.rot}</small>`}</button>`).join('')}</div>
  <div class="acao"><button class="btn sec" id="ouvir">🔊 Ouvir de novo</button></div>`;
  $.querySelector('#voltar').onclick=()=>{parar();menu()};
  $.querySelector('#ouvir').onclick=()=>toca(r.aud,r.fala);
  $.querySelectorAll('.op').forEach(b=>b.onclick=()=>escolher(b,r.ops[b.dataset.i]));
  toca(r.aud,r.fala);
}

function escolher(b,o){
  if(b.classList.contains('errou'))return;
  if(o.ok){
    b.classList.add('acertou');if(!jogo.erro)jogo.pts++;
    $.querySelectorAll('.op').forEach(x=>x.disabled=true);
    const [elogio,arq]=um(ELOGIOS);
    const msg=(o.mudo?o.rot+'! ':'')+elogio;
    $.querySelector('#bal').textContent=msg;
    toca(o.mudo?['fig-'+o.rot,arq]:[arq],msg);chuva();jogo.n++;
    setTimeout(proxima,o.mudo?2600:1800);
  }else{
    jogo.erro=true;b.classList.add('errou');
    const m=(o.mudo?`Essa é a figura ${o.rot}. `:'Quase! ')+'Tente de novo.';$.querySelector('#bal').textContent=m;toca(o.mudo?['essa-e','fig-'+o.rot,'tente']:['erro'],m);
  }
}

function chuva(){
  const c=document.createElement('div');c.className='chuva';
  c.innerHTML=Array.from({length:18},()=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.5}s">${um(['⭐','🎉','🌟','🎈'])}</i>`).join('');
  document.body.appendChild(c);setTimeout(()=>c.remove(),2400);
}

function fim(){
  const msg=jogo.pts>=4?'Você é demais!':jogo.pts>=2?'Muito bom!':'Vamos brincar mais uma vez?';
  $.innerHTML=`<div class="fim"><div class="mascote" style="font-size:7rem" aria-hidden="true">${MASC}</div>
  <h1>${msg}</h1><div class="estrelas" style="font-size:3rem">${'⭐'.repeat(jogo.pts)||'🌱'}</div>
  <div class="acao"><button class="btn" id="de-novo">🔁 Jogar de novo</button><button class="btn sec" id="menu">🏠 Outras aventuras</button></div></div>`;
  const t=jogo.t;
  $.querySelector('#de-novo').onclick=()=>{jogo={t,n:0,pts:0};proxima()};
  $.querySelector('#menu').onclick=menu;
  chuva();toca([jogo.pts>=4?'fim-otimo':jogo.pts>=2?'fim-bom':'fim-tentar'],msg);
}
menu();
</script>
</body>
</html>
